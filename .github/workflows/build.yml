name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Force Python 3.10 as default
      run: |
        sudo update-alternatives --install /usr/bin/python3 python3 /opt/hostedtoolcache/Python/3.10.*/x64/bin/python3 100
        python3 --version

    - name: Install System Dependencies
      run: |
        sudo rm -f /var/lib/apt/lists/lock
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          python3-pip \
          python3-setuptools \
          python3-wheel \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip
        pip install cython==0.29.33 buildozer

    - name: Build APK with Buildozer
      run: yes | buildozer android debug > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
