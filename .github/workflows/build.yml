name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Java (JDK 17) einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: System-Abhängigkeiten installieren
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev \
          build-essential \
          ccache

    - name: Python-Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install cython buildozer

    - name: Icon automatisch vorbereiten
      run: |
        if [ -f icon.png.jpg ]; then
          cp icon.png.jpg icon.png
          echo "Icon erfolgreich kopiert."
        fi

    - name: APK mit Buildozer erstellen
      run: |
        buildozer -v android debug

    - name: APK-Artefakt hochladen
      uses: actions/upload-artifact@v4
      with:
        name: lkw-tracker-apk
        path: bin/*.apk
